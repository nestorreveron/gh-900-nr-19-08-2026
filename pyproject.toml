[project]
name = "contoso-customer-portal"
version = "0.1.0"
description = "Repositorio de demostración GH-900 para GitHub Foundations"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
