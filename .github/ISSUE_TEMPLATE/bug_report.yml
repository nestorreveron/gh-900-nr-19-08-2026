name: Bug report
description: Reporta un error reproducible.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: {label: Resumen, description: Describe el problema}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Pasos para reproducir, value: "1.
2.
3."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Resultado esperado}
    validations: {required: true}
